<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style type="text/css">

/*

1. 테이블의 너비는 400px로 하고, 테두리선의 색을 검정색으로하고 
   테이블의 선이 보이도록 한다.(<table>태그의 border속성은 사용하지 않는다.)
   
   2. 테이블의 배경색을 노란색으로 지정하고, 'title'줄의 배경색은 'lightgreen'으로 한다.
   'title'아래의 각 줄은 짝수번째는 pink, 홀수번째는 aqua로 한다.
   
   3. 테이블의 각 선들은 한 겹으로 나타나도록 한다.
   
   4. 캡션은 아래쪽 중앙에 놓는다.

*/
table {
	width: 400px;
	border: 1px solid black;
	background-color: yellow;
}
tr:nth-child(even){
	background-color: pink;
}
tr:nth-child(odd){
	background-color: aqua;
}
td {
	border: 1px solid black;
}
caption{
	caption-side: bottom;
  	text-align: center; 
}
</style>

</head>
<body>
<table>

<caption>주 소 록</caption>
<tr class="title" Style="background-color: lightgreen;">
	<td> 이 름 </td>
	<td> 주 소 </td>
</tr>
<tr>
	<td>홍길동</td>
	<td>대전시 중구 대흥동</td>
</tr>
<tr>
	<td>일지매</td>
	<td>대전시 중구 도마동</td>
</tr>
<tr>
	<td>성춘향</td>
	<td>대전시 중구 봉명동</td>
</tr>
<tr>
	<td>이몽룡</td>
	<td>대전시 중구 법동</td>
</tr>
<tr>
	<td>이순신</td>
	<td>대전시 중구 대동</td>
</tr>
</table>
</body>
</html>
