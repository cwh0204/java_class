<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS 자식 필터</title>
<style>
td {
	width: 50px;
	text-align: center;
}
</style>

</head>
<body>

	<table border="1">
		<tr>
			<td>1</td>
			<td>2</td>
			<td>3</td>
			<td>4</td>
			<td>5</td>
		</tr>
		<tr>
			<td>6</td>
			<td>7</td>
			<td>8</td>
			<td>9</td>
			<td>10</td>
		</tr>
		<tr>
			<td>11</td>
			<td>12</td>
			<td>13</td>
			<td>14</td>
			<td>15</td>
		</tr>
	</table>
	<br>
	<hr color="red">
	<br>
	<table border="1">
		<tr>
			<td>1</td>
			<td>2</td>
			<td>3</td>
			<td>4</td>
			<td>5</td>
		</tr>
		<tr>
			<td>6</td>
			<td>7</td>
			<td>8</td>
			<td>9</td>
			<td>10</td>
		</tr>
		<tr>
			<td>11</td>
			<td>12</td>
			<td>13</td>
			<td>14</td>
			<td>15</td>
		</tr>
	</table>
	<br>
	<hr color="red">
	<br>
	<table border="1">
		<tr>
			<td>1</td>
			<td>2</td>
			<td>3</td>
			<td>4</td>
			<td>5</td>
		</tr>
		<tr>
			<td colspan="5">6</td>
		</tr>
		<tr>
			<td colspan="2">7</td>
			<td>8</td>
			<td>9</td>
			<td>10</td>
		</tr>
	</table>
</body>
</html>
