<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<!-- 
	문장이나 문자들의 묶음으로 처리하는 태그로 <div>태그와 <span>태그를 사용한다.
	
	<div>태그는 주로 섹션을 분리할 때 사용하고 줄바꿈 기능이 있다.
	<span> 태그는 글자나 문장에 style을 지정할 때 주로 사용하고 줄바꿈 기능은 없다.
	
 -->
 
 <!-- 
 	요소(태그)에 style을 지정하는 방법
 	형식) <태그명 style="스타일속성명1:값1; 스타일속성명2:값2;">내용</태그명>
  -->
 
 <!-- 
 	색깔을 지정하는 방법
 1. 색의 이름을 영문으로 기술한다.
 2. #RRGGBB
		RR ==> red의 값을 16진수로 표기(0~255)(00~ff)
		GG ==> green의 값을 16진수로 표기(0~255)(00~ff)
		BB ==> blue의 값을 16진수로 표기(0~255)(00~ff)
 3. rgb(red값,green값,blue값)
 		==> 각 색의 값을 10진수로 표기하거나 %(퍼센트)단위로 표기한다.
 4. rgba(red값, green값, blue값 투명도값)
		==> 투명도는 0부터 1사이의 값으로 지정하고, 0은 완전투명 1은 완전 불투명
  -->

</head>
<body style="background-color: #FFFFFF;">


보통글자

<div>이 영역은 div 태그 영역입니다.</div>

보통글자 <br><br>

span태그는 <span style="color: rgba(100%,0%,0%,0)">글자나 문장에</span> style을 지정할 때 주로 사용한다.

</body>
</html>
