<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iframe</title>
</head>
<body>
	<!-- 
	<iframe>태그 ==> 한 문서의 본문 영역에 다른 문서를 넣을 수 있는 태그
	
	형식)
		<iframe src="경로명/파일명.html" 또는 URL주소"></iframe>
 -->
	<h2>iframe 태그 연습</h2>
	iframe 태그는 현재의 문서에 다른 문서의 내용을 나타나게 하고 싶은 경우에 사용하는 태그이다.
	<br>
	<br> iframe의 src 속성에는 나타날 문서명이나 URL주소를 지정한다.
	<br>
	<br>

	<a href="div와 span2.html">div와 span2문서 보기</a>
	<br>
	<a href="div와span1.html" target="test">div와 span1문서 보기(타겟설정)</a>
	<br>
	<iframe src="http://www.daum.net" name="test"
		style="width: 800px; height: 500px"></iframe>

</body>
</html>
