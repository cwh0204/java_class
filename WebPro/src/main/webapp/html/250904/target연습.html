<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
</head>
<!-- 
	<a>태그의 target 속성에 설정할 수 있는 값
	1. _blank : 새창 또는 새탭에 결과가 나타난다.
	2. _self : 현재의 프레임 영역에 결과가 나타난다.
	3. _parent : 부모 프레임 영역에 결과가 나타난다.
	4. _top : 무조건 현재 창의 전체 화면에 결과가 나타난다.
	5. 프레임명 : 지정한 '프레임명'에 해당하는 프레임 영역에 결과가 나타난다.
 -->
<body style="background-color:pink;">
	<h3>targetm 속성 연습용 문서</h3>
	
	<a href="http://www.daum.net" target="_self">Daum 사이트 가기(_selp)</a><br>
	<a href="http://www.daum.net" target="_blank">Daum 사이트 가기(_blank)</a><br>
	<a href="http://www.daum.net" target="_parent">Daum 사이트 가기(_parent)</a><br>
	<a href="http://www.daum.net" target="_top">Daum 사이트 가기(_top)</a><br>
</body>
</html>
