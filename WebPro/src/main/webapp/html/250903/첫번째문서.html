<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>첫번째 문서</title>

<!--
		이영역은 주석 영역입니다.
		주석 처리 부분은 문서에 대한 설명글을 주로 작성합니다.
		그리고, 이 주석 영역은 실행에서 제외됩니다.
-->

<!-- 
	HTML 요소(Element)
형식1) <시작태그 속성명="속성값" ...> 컨텐츠(내용) </종료태그>
	==> 시작태그명과 종료태그명은 같다.
	==> 컨텐츠 자리에는 '문자열', '자식요소' 가 올수 있다.
	==> 속성은 요소의 성질, 특성을 정의하는 것으로 추가적인 정보를 제공한다.
형식2) <시작태그 속성명="속성값" ...>
	==> 컨텐츠가 없으면 '종료태그'는 없고 속성만 설정할 수 있다.
	==> 예) <meta>,<br>,<hr>,<img>,<link>,<input> 등
 -->
</head>
<body>
안녕하세요. 웹표준 UI구현 시간입니다.
<br>수정된 내용입니다.
</body>
</html>
