<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>텍스트 표시</title>
<!-- 
	HTML 문서에서는 1개 이상의 연속된 공백(space)를 삽입하여도 1개의 공백으로 표시되고,
	1개 이상의 연속된 줄바꿈(Enter)도 1개의 공백으로 표시된다.
 -->
</head>
<body>
&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp안녕하세요<br>
테스트는 body태그 안에 특별한 태그 없이<br>
입력할 수 있지만 단락을 사용하지 않으면<br>
전체가 연결되어 한 줄로 표시됩니다.
</body>
</html>
