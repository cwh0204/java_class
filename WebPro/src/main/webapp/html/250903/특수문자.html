<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>특수문자(빌트인 엔티티)</title>
<!-- 
	HTML 문서에서 특별한 용도로 사용되는 문자를 화면에 나타내기 위한 명령으로
	'빌트인 엔티티'라고 한다.
	
	형식) &명령;
	
	종류)&lt; =='<'
		&gt; =='>'
		&quot; ==> '"'
		&amp; ==>'&'
		&nbsp; ==> ' '
 -->

</head>
<body>
	&lt;script&gt;&lt;/script&gt;<br>
	<p title="나는 &quot;홍길동&quot; 입니다">홍길동</p>
	&amp;lt; 은 &lt; 를 나타낸다 <br>
	글자와 &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;글자의 사이띄기 
</body>
</html>
