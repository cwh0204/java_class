<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- 
	<pre>태그 ==> 줄바꿈이나 사이띄기등을 원본과 같게 나타낸다

	<hr>태그 ==> 수평선을 그려준다.
				color속성을 이용해서 선의 색을 지정할 수 있다.
 -->
</head>
<body>
<h2>보통의 문장</h2>
HTML 문서에는 보통                        사의 띄기나 줄바꿈은
 HTML에서 제공하는 태그나 명령을 이용해서만 가능하다.

<hr color="red">

<h2>pre 태그 영역의 문장</h2>
<pre>HTML 문서에는 보통                        사의 띄기나 줄바꿈은
 HTML에서 제공하는 태그나 명령을 이용해서만 가능하다.</pre>
 
 <hr color="red">
</body>
</html>
