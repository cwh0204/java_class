<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- 
	텍스트 서식 관련 태그들
	==> 문자에 간단한 효과를 주는 태그들을 말한다.
	==> 이 태그들은 줄바꿈 기능이 없다.
 -->
</head>
<body>
보통글자<br><br>
<b>두꺼은 글자체(b태그)</b><br>
<strong>두꺼운 글자체(strong태그)</strong><br>

<i>기울림꼴 글자(i 태그)</i><br>
<em>기울림꼴 글자(em 태그)</em><br>

<u>밑줄 문자(u 태그)</u><br>
<ins>밑줄 문자(ins 태그)</ins><br>
<strike>취소선(strike 태그)</strike><br>
<del>취소선(del 태그)</del><br>

<mark>하이라이트(mark 태그)</mark><br>
다음은 화면에 문자열을 출력하는 자바 코드입니다.<br>
<code>String.system.out.println("안녕하세요");</code><br>

보통글자 <sup>위첨(sup 태그)</sup><br>
보통글자 <sub>아래첨자(sub 태그)</sub>

<hr color="red">

<em><ins><strong>이 내용은 두껍고 밑줄이 그려진 기울림꼴 <sup>o</sup>C</strong></ins></em><br>

H<sub>2</sub>O<br>
</body>
</html>
