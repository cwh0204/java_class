<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<script type="text/javascript">
/*
 * 	출력예시1) ==> 취미를 1개 이상 선택했을 때
 		홍길동씨 당신은 남자(여자)이고
 		취미는 여행, 바둑, 테니스, 이군요!!
 	출력예시2) ==> 취미를 하나도 선택하지 않았을 때
 		홍길동 당신은 남자(여자)이고
 		취미는 없군요!!
 */

window.onload = () => {
 	const userName = document.querySelector('[name="irum"]');
 	const userGender = document.querySelector('[name="gender"]');
 	const userHobby = document.querySelector('[name="hobby"]');
	const resultBtn = document.querySelector('#viewBtn');
	const resultText = document.querySelector('[name="result"]');
	resultBtn.addEventListener("click", ()=> {
		resultText.value += userName.value;
		resultText.value += userGender.value;
		resultText.value += userHobby.value;
		
		for(let i=0; i>userHobby.length; i++){
			if(userHobby[i].cheked){
				resultText.value += userHobby[1].value;
			}
		}
/* 		if(userHobby.length != null){
			for(let i=0; i<userHobby.length; i++){
				if(userHobby[i].cheked){
					resultText.value += userHobby[1].value;
				}
			}
		} */
	});
}

</script>
</head>
<body>
	<form name="exForm">
		이 름 : <input type="text" name="irum"><br>
		<br> 성 별 : <input type="radio" name="gender" value="남자" checked>남
		<input type="radio" name="gender" value="여자" checked>여 <br>
		<br> 취 미 : <input type="checkbox" name="hobby" value="여행">여행
		<input type="checkbox" name="hobby" value="독서">독서 <input
			type="checkbox" name="hobby" value="영화감상">영화감상 <input
			type="checkbox" name="hobby" value="바둑">바둑 <input
			type="checkbox" name="hobby" value="장기">장기 <input
			type="checkbox" name="hobby" value="베드민턴">베드민턴 <input
			type="checkbox" name="hobby" value="테니스">테니스 <br>
		<br> <input type="button" value="결과 출력" id="viewBtn"><br>
		<br>
		<textarea rows="10" cols="60" name="result"></textarea>
	</form>
</body>
</html>
