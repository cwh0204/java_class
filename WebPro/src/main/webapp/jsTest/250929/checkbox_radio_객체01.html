<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<script type="text/javascript">
/*
 	- checkbox와 radio 객체
 1) name 속성값이 같은 것이 1개일 경우
 	형식) document.폼이름.객체이름.속성및메서드	
 	
 	
 2) name 속성값이 같은 것이 2개 이상일 경우
 	형식) document.폼이름.객체이름.length ==> 같은 '객체이름'의 개수를 나타낸다.
 	형식) document.폼이름.객체이름[첨자].속성및메서드

 -속성
 
 1) value ==> value 속성에 설정된 속성값을 읽어오거나 새로운 값으로 설정한다.
 2) checked ==> 현재 check된 상태이면 true, 그렇지 않으면 false가 된다.
 			==> 이 속성에 true를 대입하면 check된 상태가 되고,
 				false를 대입하면 check가 해제된 상태가 된다.
 - 메서드
 1) click() ==> 해당 객체를 클릭해 준다.
 
 
*/

const view = () => {
//	 alert( document.testForm.city.length); // 같은 name 속성값이 2개 이상일 경우에만 사용가능
//	 alert( document.testForm.city[2].value);
//	 alert( document.testForm.city[2].checked);
//	 document.testForm.city[2].checked = true;
//	 document.testForm.city[2].checked = false;
//	 document.testForm.city[2].click();
	 let srt = "";
	 for(let i = 0; i< document.testForm.city.length; i++){
		 if(document.testForm.city[i].checked){
			 srt += document.testForm.city[i].value + "\n";
		 }
	 }
	 
	 alert(srt);
}

</script>
</head>
<body>

<form name="testForm">
	<input type="checkbox" name="city" value="대전">대전
	<input type="checkbox" name="city" value="부산">부산
	<input type="checkbox" name="city" value="인천">인천
	<input type="checkbox" name="city" value="강릉">강릉
	<input type="checkbox" name="city" value="목포">목포
	<input type="checkbox" name="city" value="서울">서울
	<br><br>
	<input type="button" value="확인" onclick="view()">
</form>

</html>
