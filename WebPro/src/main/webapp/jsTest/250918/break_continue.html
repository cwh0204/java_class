    1) break문 ==> switch문과 반복문에서만 사용 가능
           ==> 반복문에서 break문을 만나면 그 즉시 반복문을 완전히 빠져나가서
                반복문 다음 문장으로 제어가 이동하낟.
                
                
   2) continue문 ==> 반복문에서만 사용 가능
             ==> 반복문에서 continue문을 만나면 반복문의 조건절 위치로
                 제어가 이동한다.
                 (조건절 위치 : for문:증감식 자리,
                           while문, do~while문 : 조건식 자리)
                           
 
 
 
 */

//문제 사용자가 입력한 값을 계속 더하고, 사용자가 0을 입력하면 그 때까지 누적한 값을
 //출력하시오.(break문 이용)
 let sum = 0;
 for(;;){
	 let i = parseInt(prompt("값을 입력해주세요"));
	 if(i == 0){

	 }else{

	 }
 }
