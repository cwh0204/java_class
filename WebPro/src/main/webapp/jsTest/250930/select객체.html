<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>select 객체</title>
<script>
/* 
   select 객체 ==> 콤보박스, 리스트박스
      1. 콤보박스 ==> size 속성이 생략되거나 size 속성값이 1일 경우
      2. 리스트박스 ==> size 속성값이 2 이상일 경우
      
 - 속성
    1) length ==> select 객체의 항목 수 (<option>의 개수)를 나타낸다.
    2) selectedIndex ==> 선택한 항목의 index(첨자) 번호를 나타낸다.
                      (선택한 항목이 하나도 없으면 -1)
    3) value ==> 현재 선택한 항목의 value 속성값을 나타낸다.
    
    4) 각 항목의 속성
       document.폼이름.객체이름.options[첨자].value
          ==> '첨자'번째 항목의 value 속성값을 나타낸다.
       document.폼이름.객체이름.options[첨자].text
          ==> '첨자'번째 항목의 내용(text값)을 나타낸다.
       document.폼이름.객체이름.options[첨자].selected
          ==> '첨자'번째 항목이 선택된 상태이면 true, 그렇지 않으면 false
          ==> 이 속성에 true를 대입하면 해당 항목이 선택된 상태가 되고 
             false를 대입하면 선택이 해제된 상태가 된다.
      
 */

 const test = ()=> {

    //console.log("selectedIndex", document.testForm.selTest.selectedIndex);
    //document.testForm.selTest.selectedIndex = 3;
    //document.testForm.selTest.selectedIndex = -1;
    
   //console.log("value", document.testForm.selTest.length);
   //console.log("length2", document.testform.selTest.options.length);
   //console.log("text", document.testForm.sleTest.options[3].text);
   //console.log("value", document.testForm.selTest.options[3].value);
   
   //console.log("현재의 선택 여부 : " + document.testForm.selTest.options[3].selected);
   
   //document.testForm.selTest.options[3].selected = true;
   //document.testForm.selTest.options[3].selected = false;
   
   const index = document.testForm.selTest.selectedIndex;
   if(index == -1){
      alert("항목을 선택한 후 사용하세요.")
      return;
   }
   alert( document.testForm.selTest.options[index].text );
   
}
 
 
</script>


</head>
<body>



   <form name="tsetForm">
      <select name="selTest" size="10">
         <option value="일">하나</option>
