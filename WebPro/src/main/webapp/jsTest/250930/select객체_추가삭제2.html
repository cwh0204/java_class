<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<style>
table {
   margin: 0 auto;
}

td {
   text-align: center;
}

select {
   width: 150px;
}

.btn {
   width: 60px;
}
</style>

</head>
<body>

   <form name="exForm">
      <table>
         <tr>
            <td colspan="3"><h2>select 객체 연습</h2></td>
         </tr>

         <tr>
            <td><select name="left" size="15"></select></td>
            <td><input type="button" value=">" class="btn"
               onclick="moveone(leftSelect, rightSelect);"><br> <br>
               <input type="button" value=">>" class="btn"
               onclick="moveall(leftSelect, rightSelect);"><br> <br>
               <input type="button" value="<" class="btn"
               onclick="moveone(rightSelect, leftSelect);"><br> <br>
               <input type="button" value="<<" class="btn"
               onclick="moveall(rightSelect, leftSelect);"><br> <br></td>
            <td><select name="right" size="15"></select></td>
         </tr>

         <tr>
            <td colspan="3"><input type="text" name="addData"> <input
               type="button" value="추가하기" onclick="add();"></td>
         </tr>

      </table>

   </form>

   <script>
    // 스크립트를 body 태그 끝에 두어 모든 HTML 요소가 로드된 후 실행되도록 함
    const leftSelect = document.querySelector('select[name="left"]');
    const rightSelect = document.querySelector('select[name="right"]');
    const addDataInput = document.querySelector('input[name="addData"]');

    // 추가하기 함수
    const add = () => {
        const value = addDataInput.value.trim();
        if (value) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            leftSelect.appendChild(option);
            addDataInput.value = '';
        }
    };

    // 선택된 항목을 이동하는 함수
    const moveone = (source, destination) => {
        // while 반복문을 사용해 선택된 항목을 모두 이동
        while(source.selectedIndex >= 0) {
            const selectedIndex = source.selectedIndex;
            destination.appendChild(source.options[selectedIndex]);
        }
    };
    
    // 전체 항목을 이동하는 함수
    const moveall = (source, destination) => {
        while (source.options.length > 0) {
            destination.appendChild(source.options[0]);
        }
    };
</script>

</body>
</html>
