<body>

	<form name="guguForm">
		<select name="dan">
			<option value="1">1 단</option>
			<option value="2">2 단</option>
			<option value="3">3 단</option>
			<option value="4">4 단</option>
			<option value="5">5 단</option>
			<option value="6">6 단</option>
			<option value="7">7 단</option>
			<option value="8">8 단</option>
			<option value="9">9 단</option>
		</select> <input type="button" value="출력" id="guguBtn">
	</form>

	<h3>결과 출력</h3>
	<div id="result"></div>

<script>
const guguBtn = document.getElementById('guguBtn');
const danSelect = document.querySelector('select[name="dan"]');
const resultDiv = document.getElementById('result');

const gugu = () => {
    const selectedDan = danSelect.value;
    
    let resultHTML = '';

    for (let i = 1; i <= 9; i++) {
        resultHTML += `<p>${selectedDan} * ${i} = ${selectedDan * i}</p>`;
    }
    resultDiv.innerHTML = resultHTML;
};

guguBtn.addEventListener('click', gugu);


</script>
