<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script>

/* - select객체에 동적으로 새로운 항목 추가하기 및 삭제하기
     1. 새로운 항목 추가하기
        1) option 객체 생성( <option value="값">text값</option>)
           형식)객체변수 = new Option(text값, value값);
           
        2) 생성된 option 객체 추가하기
           형식) document.폼이름.객체이름.options[추가할위치] = 객체변수;
           ==> '추가할위치'가 기존의 항목 index 범위에 있으면 해당 index번째의 항목이 새로운 항목으로 변경되고,
              '추가할위치'에 현재 항목의 갯수를 지정하면 항목의 끝에 추가된다.
              
              
     2. 항목 삭제하기
        형식) document.폼이름.객체이름.options[삭제할index] = null;
 */
 
 const add = ()=>{
    const newop = new Option("셋", "삼");
    
    //document.textForm.selTest.options[2] = newOp;
    //document.textForm.selTest.options[4] = newOp;
    
    
    //추가할 데이터 읽어오기
    const data = document.testForm.inputData.value;
    if(data == ""){
       alert("추가할 내용을 입력하세요.");
       document.testForm.inputData.focus();
       return;
    }
    
    // 추가할 데이터를 이용하여 Option 객체 생성
    const newOp = new Option(data, data);
    
    //현재의 항목 갯수번째에 새로운 항목을 추가한다.
    
    const len = document.testForm.selTest.length;
    document.testForm.selTest.options[len] = newOp;
    
    document.testForm.inputData.value = "";
    document.testForm.inputData.focus();
 }
 
 const del = ()=>{
    //document.testForm.selTest.options[2] = null;
    
    //선택한 항목 삭제하기
    let index = document.testForm.selTest.selectedIndex;
    // console.log(index)
    if(index == -1) {
       alert("삭제할 항목을 선택한 후 사용하세요.");
       return;
    }
    
    document.testForm.selTest.options[index] = null;
    
 }


</script>
</head>
<body>

	<form name="textForm">
		<select name="selTest" size="10">
			<option value="일">하나</option>
			<option value="이">이</option>
			<option value="하늘">하늘</option>
			<option value="별">별</option>
		</select><br> <input type="text" name="inputData"> <input
			type="button" value="추가하기" onclick="add()"> <input
			type="button" value="삭제하기" onclick="del()">


	</form>


</body>
</html>
