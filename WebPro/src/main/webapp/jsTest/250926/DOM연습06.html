<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>

<style>
body {
	text-align: center;
}

table {
	margin: 0 auto;
}

.man {
	background-color: yellow;
}

.com {
	background-color: cyan;
}
</style>

<script type="text/javascript">
	/*
	 *  '게임시작' 버튼을 누르면 컴퓨터와 가위 바위 보를 진행하는 프로그램이 진행된다.
	
	 컴퓨터의 가위 바위 보는 난수를 이용하고
	 사람의 가위 바위 보는 prompt로 입력 받아서 처리한다.
	
	 사람과 컴퓨터의 가위 바위 보 정해지면 이미지가 변경되고
	 승패 결과는 id속성값이 'result'인 곳에 출력되도록 한다.
	 */
	window.onload = function() {

		const btn = document.querySelector("#startBtn"); // 1. quertSelector -> querySelector 수정
		btn.addEventListener("click", function() { // 2. addEventListerner -> addEventListener 수정
			const data = [ "가위", "바위", "보" ];
			const idx = Math.floor(Math.random() * 3);
			const com = data[idx];
			let man;
			do {
				man = prompt("가위 바위 보를 입력하세요...");
			} while (man != "가위" && man != "바위" && man != "보");

			let result;
			if (com == man) {
				result = "비겼습니다....";
			} else if (man == "가위" && com == "보" || man == "바위" && com == "가위"
					|| man == "보" && com == "바위") { // 3. con -> com 수정
				result = "당신이 이겼습니다";
			} else {
				// 참고: 이전 코드에서 이 else 블록은 "비겼습니다" 였는데, 
				// 위에서 비기는 경우를 처리했으므로 이 블록은 "컴퓨터가 이겼습니다"가 되어야 논리적으로 맞습니다.
				result = "컴퓨터가 이겼습니다";
			}

			// 이미지 변경
			document.manImg.src = `../../images/${man}_좌.PNG`;
			document.comImg.src = `../../images/${com}_우.PNG`;

			document.getElementById("result").innerHTML = "결과 : " + result; // 4. innerHtml -> innerHTML 수정

		});
	}
</script>

</head>
<body>
	<form>
		<input type="button" value="게임시작" id="startBtn">
	</form>
	<table>
		<tr>
			<td class="man">사 람</td>
			<td class="com">컴퓨터</td>
		</tr>
		<tr>
			<td><img src="../../images/바위_좌.PNG" name="manImg"></td>
			<td><img src="../../images/바위_우.PNG" name="comImg"></td>
		</tr>
		<tr>
			<td colspan="2" id="result"></td>
		</tr>
	</table>
</body>
</html>
