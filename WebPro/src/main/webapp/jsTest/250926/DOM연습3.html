<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style type="text/css">
#buttonList {
	background-color: 1px solid blue;
	padding: 5px;
}
</style>
<script type="text/javascript">
/*
 *  '버튼 추가' 버튼을 누르면
 		<input type="button" value="삭제_번호" onclick="del(this)>"
 		와 같은 버튼을 아래의 <div>영역에 추가하고
 		추가된 버튼을 누르면 해당 버튼이 삭제되도록 한다.
 		그리고 추가되는 버튼의 value속성에 지정한 '삭제_번호'에서 '번호'는
 		버튼이 새로 추가될 때마다 증가되도록 한다.
 */
 let num = 0;
 add = () => {
	 num++;
/* 	 	const inputTag = document.createElement("input");
	 	inputTag.setAttribute("type","button");
	 	inputTag.setAttribute("value", "삭제_"+num);
	 	inputTag.setAttribute("onclick", "del(this)"); */
	 	
	 	const div = document.getElementById("buttonList");
	 	
	 	const inputTag = `<input type="button" value="삭제_${num}" onclick="del(this)">`;
	 	
	 	div.innerHTML += inputTag; 
 }
 
 del = (btn) => {
	 btn.remove();
 }
 	
</script>
</head>
<body>
	<input type="button" value="버튼 추가" onclick="add()">
	<br>
	<hr color="red">
	<br>
	<div id="buttonList"></div>
</body>
</html>
