<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>image 객체 처리</title>
</head>
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script type="text/javascript">
/*
 * Image 객체 ==> <img> 태그를 개체화 한 것
 			 ==> document객체의 하위 객체
 			 ==> 문서에 <img>태그를 사용하면 자바스크립트에는 'images'라는 이름의
 			 	 배열이 자동으로 만들어지고 이 배열에 image 객체가 순서대로 저장된다.
 	<img src = "경로명/파일명.확장자" name="이미지객체이름" 속성들....>
 	
 	-- 자바스크립트에서 IMage객체를 사용하는 방법
 	1) images 배열을 이용하는 방법
 	형식) document.images[점자].속성메서드
 	
 	2) name 속성을 이용하는 방법
 	형식) document.이미지객체이름.속성및메서드
 	
 	3) DOM API의 요소찾기 메서드를 이용하는 방법
 	
 	
 */

 view = () => {
/* 	 console.log("src", document.images[0].src);
	 console.log("src",document.images["uml"].src); */
	 
/* 	 document.uml.border = 10;
	 document.uml.width = 300;
	 document.uml.hight = 500; */
	 
	 const res = String(document.sw.src);
	 if (res.includes("sw_off.jpg")) {
		 document.sw.src = "../../images/sw_on.jpg";
	 } else {
		 document.sw.src = "../../images/sw_off.jpg";
	 }
 }
</script>
<body>
	<!-- 	<form>
		<input type="button" value="확인" onclick="view()">
	</form>
	<br>
	<hr coler="red">
	<br> -->
	<!-- <img src="../../images/UML.jpg" name="uml">
<img src="../../images/jQuery.jpg" name="jquery"> -->

	<img src="../../images/sw_off.jpg" name="sw" onclick="view()"
		class='classw'>
</body>
</html>
