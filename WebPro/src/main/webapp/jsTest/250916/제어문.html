/*  문제) 점수를 입력 받고, 이 점수를 이용하여 학점을 구하시오.
 	(점수는 0 ~ 100점 사이를 정확히 입력한다.)
 	점수가
 		90이상 100이하면 A학점
 		80이상 90미만이면 B학점
 		70이상 80미만이면 C학점
 		60이상 70미만이면 D학점
 		60미만이면 F학점 */
 let num5 = prompt("점수를 입력해주세요?");
 let parNum5 = parseInt(num5)
 if(parNum5 >= 90){
	 console.log("A학점입니다");
 }else if(parNum5 >= 80 && parNum5 <= 89){
	 console.log("B학점입니다");

	 console.log("C학점입니다");
 }else if(parNum5 >= 60 && parNum5 <= 69){
	 console.log("D학점입니다");
 }else{
	 console.log("F학점입니다");
 }
