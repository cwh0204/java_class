//문제) 사용자로부터 출력할 단을 입력 받아서 해당 단을 출력하시오.

let num = parseInt(prompt("출력할 단을 입력하세요"));

for(let i = 1; i<=9; i++){
	console.log(num+"*"+i+"="+num*i);
}

let num1 = 0;
for(let j = 1; j<=100; j++){
	num1 += j;
	if((j % 10) == 0){
		console.log("1부터"+j+"까지의 합계 = "+num1);
	}
}

//양의 정수 2개를 차례로 입력받아서 작은 수부터 큰 수 까지의 합계를 구하시오.

let first = parseInt(prompt("시작할 수를 입력하세요"));
let next = parseInt(prompt("종료할 수를 입력하세요"));

let sum = 0;

for(let k = first; k<= next; k++){
	sum+= k;
}

console.log("총합은"+sum);
