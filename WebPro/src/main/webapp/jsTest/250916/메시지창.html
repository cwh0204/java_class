<meta charset="UTF-8">

<script type="text/javascript">

/* 1) alert 창 ==> 경고 메시지를 출력하는 창
형식) alert("메시지");

alert("안녕하세요 alert창 입니다.");
alert("안녕하세요 alert창 입니다. \nalert 창입니다."); 

2) prompt 창 ==> 사용자로부터 자료를 입력 받는 창
형식) 변수 = prompt("메시지", "초기값");
	==> 입력할 수 있는 창이 나타나고, 이 입력 창에 자료를 입력한 후 '확인' 버튼이나
		'Enter' 키를 누르면 입력한 값이 '변수'에 문자열로 저장된다.
	==> '취소' 버튼이나 'Esc'키를 누르면 null이 '변수'에 저장된다.
*
*
* 
*/
 let num1 = prompt("숫자를 입력해주세요?");
 let num2 = prompt("두번째 숫자를 입력해주세요");
 let sum = parseInt(num1) + parseInt(num2);
 console.log(sum);

</script>
