/*
    String 객체 ==> 문자열을 처리하는 객체
    
 - 객체 생성 ==> 문자열 자체로 객체로 본다.
    let 객체변수 = "문자열";
    let 객체변수 = new String("문자열");
    
 - 속성
    length ==> 문자열의 길이(글자수)를 나타낸다.
    
 - 메서드
    1) toLowerCase() ==> 영문자를 소문자로 변환.
       toUpperCase() ==> 영문자를 대문자로 변환
       
       
       
      let str = "ABCd efGhiJK";
      console.log( str.toLowerCase());
      console.log( str.toUpperCase());
       
      
      
       
 2) indexOf(찾는 문자열, 시작 위치);
    lastIndexOf(찾는 문자열, 시작위치);
       ==> 문자열에서 '찾는문자열'의 위치값을 반환한다.
       ==> 문자열에서 '찾는문자열'이 없으면 -1을 반환한다.
       ==> indexOf() 메서드는 앞쪽에서 뒤쪽 방향으로 검색을 진행하고, lastIndexOf()메서드는 뒤쪽에서 앞쪽 방향으로 검색을 진행한다.
       ==> '시작위치'는 검색을 시작하는 위치. 생략하면 indexOf()는 처음위치, lastIndexOf()는 마지막 위치에서부터 검색을 진행함.
          (문자열의 index는 0부터 시작)
       
       console.log( "abcdeabcde".indexOf("cd") ); //2
       console.log( "abcdeabcde".lastIndexOf("cd") ); //7
       
       console.log( "abcdeabcde".indexOf("cd", 4) ); //7
       console.log( "abcdeabcde".lastIndexOf("cd", 4) ); //2
       
       console.log( "abcdeabcde".lastIndexOf("xy") ); //2
    
       
 3) 문자열1.concat(문자열2)
    ==> 문자열1 뒤에 문자열2를 연결하여 하나의 문자열로 만들어 반환.
    ==>( "문자열1" + "문자열2" ) 과 같다.
    
    console.log("우리나라".concat("대한민국")); //우리나라대한민국
    
    
 4) trim()
    ==>문자열의 앞쪽과 뒤쪽의 공백을 모두 없앤다.
    
    let str2 = "   ab   cd      ";
    console.log("[" + str + "]");
    console.log("[" + str.trim() + "]")
    
    
 5) replace(찾는문자열, 바꿀문자열)
    ==> 문자열에서 '찾는문자열'을 찾아서 '바꿀문자열'로 바꿔준다.
    
    
 let str3 = "abcdef";
 console.log("str = " );
 console.log( str3.replace("cd", "가나다라" ));
 
 6) split("구분문자")
    ==> 문자열을 '구분문자'를 기준으로 분리하고 분리된 데이터들을 배열에 담아 반환.
    
    
 const str4 = "홍길동&이순신&성춘향&이몽룡&일지매";

    console.log(data);

 7) 문자열의 일부를 추출하는 메서드들
    - charAt(위치값)
       ==> 문자열에서 '위치값'번째의 1문자를 추출.
    
    - substring(시작위치, 종료위치)
       ==> 문자열의 시작위치부터 종료위치 이전까지의 문자열을 추출.
       ==> 종료위치를 생략하면 시작위치부터 끝까지 문자열을 추출.
       
    - slice(시작위치, 종료위치)
       ==> 문자열의 시작위치부터 종료위치 이전까지의 문자열을 추출한다.
       ==> 종료위치를 생략하면 시작위치부터 긑까지의 문자열을 추출한다.
       ==> 종료위치가 음수이면 시작위치부터 끝까지의 문자열 중 뒤에서부터 생략할 개수로 처리한다.
       
    - substr(시작위치, 개수)
       ==> 시작위치부터 개수만큼 문자열을 추출한다.
       
       
    console.log( "abcdef".charAt(3) );   //d
    console.log( "abcdefghijk".substring(2,6) ); // cdef
    console.log( "abcdefghijk".substring(2) ); // cdefghijk
    console.log( "abcdefghijk".substring(7,3) ); // defg
    
    console.log("-----------------------");
    console.log("abcdefghijk".slice(2,6) ); //cdef
    console.log("abcdefghijk".slice(2) ); //cdefghijk
    console.log("abcdefghijk".slice(2, -3) );  // cdefgh
    console.log("----------------------"); 
    
    console.log( "abcdefghijk".substr(2,5) ); // cdefg
    
    
    
    
 */
