<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>


<script>

/*
    이벤트(event) ==> 사용자의 행동 발생을 알리는 신호를 말함.(마우스 클릭, 키보드 입력, 마우스 이동 등...)
                 
    
    이벤트핸들러
       ==> 이벤트가 발생했을 때 처리할 프로그램 집합
       ==> 보통 이벤트 핸들러의 내용이 복잡하거나 많으면 이런 내용을 함수로 작성하고 '이벤트핸들러'에서 이 함수를 호출하여 실행함.
       
    - 이벤트와 이벤트핸들러를 서로 연결하여 프로그램을 진행함.
    
    
    
    이벤트와 이벤트핸들러를 연결하기.
    
1) HTML태그에서 직접 지정하는 방법(인라인이라고 함. 주로 test용으로 많이 사용.)
형식) <태그명 ...on이벤트명="이벤트핸들러">내용</태그명>


2) script 영역에서 지정하는 방법
   2-1) '객체.on이벤트명'을 이용하는 방법
       (한 요소에 이벤트를 여러개 설정하면 나중에 설정한 이벤트핸들러로 덮어 써진다.)
   
   <script>
      객체명.on이벤트명 = function() {
            처리할 내용들;
            ...
      }
    < /script>
    
 2-2) '객체.addEventListener()'를 이용하는 방법
       (한 요소에 같은 이벤트를 여러개 설정하면, 이벤트 큐에 저장되고 실행도 순차적으로 된다.)
    <script>
       객체명.addEventListener("이벤트명", function() {
          처리할 내용들;
          ...
       })
    < /script>
    
       
       
    이벤트 종류
    
 1. click  ==>  클릭
 2. dbclick  ==> 더블클릭
 3. mousedown, up, over(마우스 커서가 영역 내에 들어갔을 때.)
 4. mouseout ==> 마우스커서가 객체의 영역 안에서 벗어나는 순간
 5. mousemove ==> 마우스가 움직이는 순간마다 발생하는 이벤트
 
 6. focus ==> 포커스가 발생하는 순간 발생하는 이벤트.(focus : 입력창이 있는 곳. 깜빡이는 그 입력창.)
 7. blur ==> 포커스를 잃어버리는 순간 발생하는 이벤트.
 
 8. change ==> 값이 변경됐을 때 생기는 이벤트.
 9. submit ==> 서버로 데이터를 전송하기 직전 발생하는 이벤트
 10. reset ==> form에서 reset(초기화) 하는 순간에 발생하는 이벤트
 
 11. load ==> 문서, 이미지 등의 읽기 작업(로딩)이 완료된 후에 발생하는 이벤트
 12. unload ==> 문서가 닫히는 순간 발생하는 이벤트
 
 13. keydown ==> 키보드를 누르는 순간 발생하는 이벤트
 14. keyup ==> 눌러진 키보드가 올라오는 순간 발생하는 이벤트.
 15. keypress ==> 키보드가 눌렸다가 떨어지는 순간.(keydown + up. 계속 누르고 있는 동안 계속 발생.)
 
 16. resize ==> 크기가 변경되는 순간 발생하는 이벤트
 17. DOMContentLoaded ==> 문서가 얽혀져서 'DOM객체'로 변환된 후에 발생하는 이벤트.
 
 */

	 alert("반갑습니다");
 } */

 });
 
 
</script>
